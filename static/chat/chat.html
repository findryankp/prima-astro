<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prima Astro | Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Add jQuery and Select2 for searchable dropdown -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo">
                <h2>✨ Prima<span>Astro</span></h2>
            </div>
                        <nav>
                <ul>
                    <li class="" id="nav-dashboard" onclick="window.location.href='/'" style="cursor: pointer;">Dashboard</li>
                    <li class="" id="nav-insight" onclick="window.location.href='/insight'" style="cursor: pointer;">Insight</li>
                    <li class="" id="nav-forecast" onclick="window.location.href='/forecast'" style="cursor: pointer;">Forecasting</li>
                    <li class="active" id="nav-chat" onclick="window.location.href='/chat'" style="cursor: pointer;">AI Assistant</li>
                </ul>
            </nav>
            <div class="user-profile">
                <div class="avatar">👨‍💻</div>
                <div class="info">
                    <p class="name">Admin</p>
                    <p class="role">Sparepart Manager</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Dashboard View -->
            <!-- Chatbot View -->
            <section id="view-chat" class="view-section active">
                <header class="top-header">
                    <h1>AI Assistant</h1>
                    <p>Ask anything about inventory, trends, or predictions</p>
                </header>

                <div class="chat-container glass-panel">
                    <div class="chat-messages" id="chat-messages">
                        <div class="message ai-message">
                            <div class="bubble">Hello! I am your Prima Astro Assistant. ✨<br><br>How can I help you today?</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type your query here... (e.g., 'Cek stok PALU KARET')">
                        <button id="send-btn">Send</button>
                    </div>
                </div>
            </section>

        </main>
    </div>
    
    <script src="/static/chat/chat.js"></script>
</body>
</html>
