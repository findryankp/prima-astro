<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Prima Astro Agentic AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/components/auth.js"></script>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                ✨
            </div>
            <h2>Prima <span>Astro</span></h2>
            <p>Agentic AI Sparepart Management</p>
        </div>

        <div id="login-alert" class="login-alert">
            <span class="alert-icon">⚠️</span>
            <span id="alert-text">Username atau password salah!</span>
        </div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="btn-toggle-pwd" title="Lihat/Sembunyikan password">👁️</button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="login-btn">
                <span>Masuk ke Dashboard</span>
                <span>➔</span>
            </button>
        </form>

        <div class="demo-credentials-badge">
            🔑 <strong>Akses Demo:</strong><br>
            User: <span class="clickable-chip" id="chip-user" title="Klik untuk isi">admin</span> &nbsp;|&nbsp; 
            Pass: <span class="clickable-chip" id="chip-pass" title="Klik untuk isi">admin</span>
            <div style="margin-top: 6px; font-size: 0.75rem; color: #94a3b8;">(Klik teks di atas untuk mengisi otomatis)</div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePwdBtn = document.getElementById('toggle-password');
        const alertBox = document.getElementById('login-alert');
        const alertText = document.getElementById('alert-text');
        const btnSubmit = document.getElementById('btn-submit');

        // Toggle password visibility
        togglePwdBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePwdBtn.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Clickable demo chips
        document.getElementById('chip-user').addEventListener('click', () => {
            usernameInput.value = 'admin';
            passwordInput.focus();
        });
        document.getElementById('chip-pass').addEventListener('click', () => {
            passwordInput.value = 'admin';
        });

        // Form Submit
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            btnSubmit.innerHTML = '<span>Memverifikasi...</span> ⏳';
            btnSubmit.disabled = true;

            setTimeout(() => {
                const result = Auth.login(user, pass);
                if (result.success) {
                    btnSubmit.innerHTML = '<span>Berhasil Masuk!</span> ✅';
                    btnSubmit.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);
                } else {
                    btnSubmit.innerHTML = '<span>Masuk ke Dashboard</span> ➔';
                    btnSubmit.disabled = false;
                    alertText.textContent = result.message;
                    alertBox.className = 'login-alert danger';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 350);
        });
    </script>
</body>
</html>
