<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prima Astro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/components/sidebar.js"></script>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Dashboard View -->
            <section id="view-dashboard" class="view-section active">
                <header class="top-header">
                    <h1>Overview</h1>
                    <p>Real-time sparepart monitoring & analytics</p>
                </header>

                <!-- Metrics Cards -->
                <div class="metrics-grid">
                    <div class="metric-card glass-panel">
                        <h3>Total Items</h3>
                        <p class="value" id="stat-total">-</p>
                    </div>
                    <div class="metric-card glass-panel warning-card">
                        <h3>Low Stock Alerts</h3>
                        <p class="value" id="stat-low">-</p>
                    </div>
                    <div class="metric-card glass-panel">
                        <h3>Total Transactions</h3>
                        <p class="value" id="stat-tx">-</p>
                    </div>
                </div>

                <!-- Tables Grid -->
                <div class="tables-grid">
                    <div class="table-container glass-panel">
                        <h3>⚠️ Low Stock Warnings</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Item Number</th>
                                    <th>Product Name</th>
                                    <th>SOH</th>
                                    <th>Safety</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-low-stock">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>

                    <div class="table-container glass-panel">
                        <h3>🔄 Recent Outgoing</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Product</th>
                                    <th>Qty</th>
                                    <th>Dept</th>
                                    <th>PIC</th>
                                </tr>
                            </thead>
                            <tbody id="table-recent-tx">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/dashboard/dashboard.js"></script>
</body>

</html>
